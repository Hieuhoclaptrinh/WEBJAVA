# =====================================================================
#  Cau hinh ket noi MySQL + HikariCP
#  File nay duoc dong goi vao WEB-INF/classes/db.properties
#
#  ===> DUNG SUA FILE NAY de khai bao mat khau cua may ban. <===
#  File nay duoc git theo doi, sua o day thi lan nao dong bo giua may Windows
#  va macOS cung xung dot, va co nguy co day mat khau len GitHub.
#
#  Thu tu uu tien (tang sau ghi de tang truoc):
#    1. db.properties          <- file nay, gia tri mac dinh dung chung
#    2. db.local.properties    <- rieng tung may, .gitignore bo qua
#                                 (xem db.local.properties.example)
#    3. DB_URL / DB_USERNAME / DB_PASSWORD  <- bien moi truong, cho deploy that
# =====================================================================

# ---------- JDBC ----------
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/student_rent?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
jdbc.username=root
jdbc.password=

# ---------- HikariCP pool ----------
# So connection toi da trong pool
hikari.maximumPoolSize=10
# So connection idle luon giu san
hikari.minimumIdle=2
# Thoi gian cho lay connection (ms) truoc khi nem SQLException
hikari.connectionTimeout=30000
# Connection idle bao lau thi bi thu hoi (ms)
hikari.idleTimeout=600000
# Tuoi toi da cua 1 connection (ms) - nen nho hon wait_timeout cua MySQL
hikari.maxLifetime=1800000
# Cau lenh kiem tra connection con song
hikari.connectionTestQuery=SELECT 1
hikari.poolName=StudentRentPool
# Bat/tat auto-commit mac dinh
hikari.autoCommit=true

# ---------- Upload anh (avatar khach thue, anh phong...) ----------
# De trong = dung mac dinh ~/studentrent-uploads (AppContextListener tao khi
# khoi dong). Thu muc nay nam NGOAI webapp nen anh khong bi xoa moi lan
# "mvn clean package". Moi may muon luu o cho khac thi khai bao lai key nay
# trong db.local.properties, KHONG sua o day.
app.upload.dir=
